<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NW Admin Panel — Paraathippetti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- ============ LOGIN ============ -->
<div class="admin-login-wrap" id="loginWrap">
  <form class="admin-login-card" id="loginForm" novalidate>
    <div class="admin-login-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>NW Admin Panel</h1>
    <p class="modal-sub">Sign in to manage complaints</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <p class="form-error" id="loginError" hidden></p>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign in</button>
    <a href="index.html" class="back-link">&larr; Back to site</a>
  </form>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="admin-dashboard" id="dashboard" hidden>
  <header class="admin-topbar">
    <span class="brand">NW Admin Panel</span>
    <div>
      <span class="admin-email" id="adminEmail"></span>
      <button class="btn btn-outline" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="admin-tabs">
    <button class="tab-btn active" data-tab="tabComplaints" type="button">Complaints</button>
    <button class="tab-btn" data-tab="tabContent" type="button">Site Content</button>
  </div>

  <main class="admin-main">
    <div class="tab-panel active" id="tabComplaints">
      <div class="admin-toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name, class, or tracking ID">
        <select id="sortSelect" class="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <button class="btn btn-outline" id="exportCsvBtn" type="button">⭳ Export CSV</button>
      </div>

      <div class="admin-filters">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="pending">Pending</button>
        <button class="filter-chip" data-filter="approved">Approved</button>
        <button class="filter-chip" data-filter="rejected">Rejected</button>
        <button class="filter-chip" data-filter="custom">Custom</button>
      </div>

      <p class="empty-note" id="dashEmpty" hidden>No complaints yet.</p>
      <div class="admin-list" id="adminList"></div>
    </div>

    <div class="tab-panel" id="tabContent" hidden>
      <div class="content-section" id="section_projects_upcoming">
        <h2>Upcoming Projects</h2>
        <form class="content-add-form" data-collection="projects_upcoming">
          <input type="text" name="title" placeholder="Title" required>
          <textarea name="description" placeholder="Description" required rows="2"></textarea>
          <button type="submit" class="btn btn-primary">+ Add</button>
        </form>
        <div class="content-list" id="contentList_projects_upcoming"></div>
      </div>

      <div class="content-section" id="section_projects_done">
        <h2>Completed Projects</h2>
        <form class="content-add-form" data-collection="projects_done">
          <input type="text" name="title" placeholder="Title" required>
          <textarea name="description" placeholder="Description" required rows="2"></textarea>
          <button type="submit" class="btn btn-primary">+ Add</button>
        </form>
        <div class="content-list" id="contentList_projects_done"></div>
      </div>

      <div class="content-section" id="section_funds">
        <h2>Funds Collected &amp; Used</h2>
        <form class="content-add-form" data-collection="funds">
          <input type="text" name="title" placeholder="Title (e.g. Sports Day 2026)" required>
          <input type="text" name="collected" placeholder="Amount collected (e.g. ₹45,000)" required>
          <input type="text" name="usedFor" placeholder="Used for" required>
          <button type="submit" class="btn btn-primary">+ Add</button>
        </form>
        <div class="content-list" id="contentList_funds"></div>
      </div>
    </div>
  </main>
</div>

<!-- ============ COMPLAINT DETAIL MODAL ============ -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <button class="modal-close" id="detailCloseBtn" aria-label="Close">&times;</button>
    <div id="detailContent"><!-- filled by admin.js --></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/admin.js?v=2"></script>
</body>
</html>
