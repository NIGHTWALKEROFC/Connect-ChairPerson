<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Voice to the Chair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- ============ DEBUG / DIAGNOSTICS ============
     This panel and the vtcLog() function exist purely to help you see
     exactly what's happening when something goes wrong (e.g. login not
     working). It logs every step to both this on-page panel and the
     browser console. Safe to leave in permanently — it's invisible unless
     you open it, and it's not visible to students since it's only on
     admin.html, not index.html. -->
<script>
  function vtcLog(msg) {
    var line = "[" + new Date().toLocaleTimeString() + "] " + msg;
    console.log(line);
    var el = document.getElementById("debugLog");
    if (el) { el.textContent += line + "\n"; el.scrollTop = el.scrollHeight; }
  }
  window.addEventListener("error", function (e) {
    vtcLog("PAGE ERROR: " + e.message + " (" + (e.filename || "") + ":" + (e.lineno || "") + ")");
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
    vtcLog("UNHANDLED PROMISE REJECTION: " + reason);
  });
</script>

<div class="debug-panel" id="debugPanel">
  <div class="debug-panel-head">
    <span>Diagnostics</span>
    <button type="button" id="debugToggle">hide</button>
  </div>
  <pre id="debugLog">[start] Page loading...\n</pre>
</div>
<script>
  document.getElementById("debugToggle").addEventListener("click", function () {
    var log = document.getElementById("debugLog");
    var hidden = log.style.display === "none";
    log.style.display = hidden ? "block" : "none";
    this.textContent = hidden ? "hide" : "show";
  });
</script>

<!-- ============ LOGIN ============ -->
<div class="admin-login-wrap" id="loginWrap">
  <form class="admin-login-card" id="loginForm" novalidate>
    <div class="admin-login-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>Chairperson's Office</h1>
    <p class="modal-sub">Sign in to manage complaints</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <p class="form-error" id="loginError" hidden></p>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign in</button>
    <a href="index.html" class="back-link">&larr; Back to site</a>
  </form>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="admin-dashboard" id="dashboard" hidden>
  <header class="admin-topbar">
    <span class="brand">Chairperson's Office — Admin</span>
    <div>
      <span class="admin-email" id="adminEmail"></span>
      <button class="btn btn-outline" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-filters">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="pending">Pending</button>
      <button class="filter-chip" data-filter="approved">Approved</button>
      <button class="filter-chip" data-filter="rejected">Rejected</button>
      <button class="filter-chip" data-filter="custom">Custom</button>
    </div>

    <p class="empty-note" id="dashEmpty" hidden>No complaints yet.</p>
    <div class="admin-list" id="adminList"></div>
  </main>
</div>

<!-- ============ COMPLAINT DETAIL MODAL ============ -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <button class="modal-close" id="detailCloseBtn" aria-label="Close">&times;</button>
    <div id="detailContent"><!-- filled by admin.js --></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onload="vtcLog('Loaded firebase-app-compat.js')" onerror="vtcLog('FAILED to load firebase-app-compat.js — check internet connection or ad-blocker')"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onload="vtcLog('Loaded firebase-firestore-compat.js')" onerror="vtcLog('FAILED to load firebase-firestore-compat.js')"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" onload="vtcLog('Loaded firebase-auth-compat.js')" onerror="vtcLog('FAILED to load firebase-auth-compat.js')"></script>
<script src="js/firebase-config.js" onload="vtcLog('Loaded js/firebase-config.js')" onerror="vtcLog('FAILED to load js/firebase-config.js — check the file path')"></script>
<script src="js/admin.js" onload="vtcLog('Loaded js/admin.js')" onerror="vtcLog('FAILED to load js/admin.js — check the file path')"></script>
</body>
</html>
